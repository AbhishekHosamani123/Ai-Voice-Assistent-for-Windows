[project]
name = "voice-agent-backend"
version = "0.1.0"
description = "Real-time voice agent: LiveKit + Groq (STT/LLM) + ElevenLabs (TTS)"
requires-python = ">=3.10, <3.14"
dependencies = [
    "livekit-agents[groq,elevenlabs,silero]~=1.8",
    "livekit-api~=1.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "edge-tts>=7.0",
    "miniaudio>=1.59",
]

[tool.uv]
# yarl 1.24.1 shipped without sdist/cp311 wheels; unpin once fixed upstream
constraint-dependencies = ["yarl<1.24"]

[tool.ruff]
line-length = 100
target-version = "py310"
